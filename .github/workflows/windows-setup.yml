name: Build EHRNow Windows Setup
on:
  workflow_dispatch:
  push:
    paths:
      - 'installer/windows/**'
      - 'compose.installer.yaml'
      - 'backend/**'
      - 'apps/clinician-web/**'
      - '.github/workflows/windows-setup.yml'
jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --yes --no-progress
      - name: Build Setup EXE
        shell: pwsh
        run: |
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" installer\windows\EHRNow.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v4
        with:
          name: EHRNow-Setup-Windows-x64
          path: artifacts/EHRNow-Setup-Windows-x64.exe
          if-no-files-found: error
