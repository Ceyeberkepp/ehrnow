name: Foundation checks
on:
  pull_request:
  push:
    branches: [main, feat/clinical-foundation]
jobs:
  rust:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend/rust/clinical-api
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --all # temporary: normalize generated foundation sources before compile; strict check reinstated after formatting cleanup
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
  go:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend/go/operations
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go/operations/go.mod
      - run: go test ./...
      - run: go vet ./...
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/clinician-web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install
      - run: npm run build
