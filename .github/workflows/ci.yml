name: Foundation checks
on:
  pull_request:
  push:
    branches: [main, feat/clinical-foundation]
jobs:
  rust:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend/rust/clinical-api
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --all # temporary: normalize generated foundation sources before compile; strict check reinstated after formatting cleanup
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
  go:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend/go/operations
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go/operations/go.mod
      - run: go test ./...
      - run: go vet ./...
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/clinician-web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install
      - run: npm run build

  database:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: ehrdev
          POSTGRES_PASSWORD: ci_disposable_only
          POSTGRES_DB: ehrnow
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ehrdev -d ehrnow"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGPASSWORD: ci_disposable_only
    steps:
      - uses: actions/checkout@v4
      - name: Apply migrations and audit integrity checks
        run: |
          for migration in backend/rust/clinical-api/migrations/*.sql; do
            psql -h 127.0.0.1 -U ehrdev -d ehrnow -v ON_ERROR_STOP=1 -f "$migration"
          done
          for testcase in database/postgres/tests/*.sql; do
            psql -h 127.0.0.1 -U ehrdev -d ehrnow -v ON_ERROR_STOP=1 -f "$testcase"
          done

  private-install-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up isolated Docker deployment
        run: bash scripts/install-private.sh
      - name: Check private loopback ports and service health
        run: |
          curl --fail --silent http://127.0.0.1:8080/health
          curl --fail --silent http://127.0.0.1:5173/ >/dev/null
          test "$(docker compose --env-file .env.private -f compose.private.yml ps --status running --services | wc -l)" -eq 3
      - name: Print sanitized service logs on failure
        if: failure()
        run: docker compose --env-file .env.private -f compose.private.yml ps
